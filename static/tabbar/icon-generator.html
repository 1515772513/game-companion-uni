<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabBar 图标生成器</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f5f5f5;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 8px;
    }
    h1 {
      color: #FF6B00;
    }
    .preview {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin: 20px 0;
    }
    .icon-item {
      text-align: center;
      padding: 20px;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
    }
    canvas {
      border: 1px solid #ddd;
      margin: 10px 0;
    }
    button {
      background-color: #FF6B00;
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background-color: #E65A00;
    }
    .download-all {
      background-color: #07c160;
      margin-top: 20px;
      font-size: 18px;
      padding: 15px 40px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>游戏陪玩 - TabBar 图标生成器</h1>

    <p>点击下面的按钮生成并下载 TabBar 图标：</p>

    <div class="preview" id="preview">
      <!-- 图标预览将在这里生成 -->
    </div>

    <button class="download-all" onclick="downloadAll()">下载全部图标</button>
  </div>

  <script>
    const icons = [
      { name: 'home', label: '首页' },
      { name: 'order', label: '订单' },
      { name: 'message', label: '消息' },
      { name: 'profile', label: '我的' }
    ];

    function createIcon(name, isActive) {
      const canvas = document.createElement('canvas');
      canvas.width = 81;
      canvas.height = 81;
      const ctx = canvas.getContext('2d');

      // 背景色
      ctx.fillStyle = isActive ? '#FF6B00' : '#999999';
      ctx.fillRect(0, 0, 81, 81);

      // 绘制简单图标
      ctx.fillStyle = isActive ? '#FFFFFF' : '#FFFFFF';
      ctx.font = '40px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // 根据图标类型绘制不同的符号
      const symbols = {
        home: '⌂',
        order: '📋',
        message: '💬',
        profile: '👤'
      };

      ctx.fillText(symbols[name] || '?', 40.5, 40.5);

      return canvas;
    }

    function generatePreview() {
      const preview = document.getElementById('preview');
      preview.innerHTML = '';

      icons.forEach(icon => {
        const div = document.createElement('div');
        div.className = 'icon-item';

        const label = document.createElement('div');
        label.innerHTML = `<strong>${icon.label}</strong>`;
        div.appendChild(label);

        // 未选中状态
        const canvas1 = createIcon(icon.name, false);
        canvas1.title = `${icon.name}.png (未选中)`;
        div.appendChild(canvas1);

        // 选中状态
        const canvas2 = createIcon(icon.name, true);
        canvas2.title = `${icon.name}-active.png (选中)`;
        div.appendChild(canvas2);

        preview.appendChild(div);
      });
    }

    function downloadCanvas(canvas, filename) {
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function downloadAll() {
      icons.forEach(icon => {
        // 下载未选中状态
        const canvas1 = createIcon(icon.name, false);
        downloadCanvas(canvas1, `${icon.name}.png`);

        // 下载选中状态
        const canvas2 = createIcon(icon.name, true);
        downloadCanvas(canvas2, `${icon.name}-active.png`);
      });

      setTimeout(() => {
        alert('所有图标已下载！\n\n请将这些文件放到项目的 static/tabbar/ 目录下。');
      }, 500);
    }

    // 页面加载时生成预览
    window.onload = generatePreview;
  </script>
</body>
</html>
